<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jiffy Lube Chicagoland</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 700px;
      width: 100%;
    }

    .logo-wrap {
      margin-bottom: 40px;
    }

    .logo-wrap img {
      max-width: 260px;
      width: 100%;
    }

    /* Fallback text logo if image is missing */
    .logo-text {
      display: inline-block;
      background-color: #e31837;
      color: #ffffff;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 14px 32px;
      border-radius: 4px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .logo-text span {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #ffd700;
      margin-top: 4px;
    }

    .divider {
      width: 60px;
      height: 4px;
      background-color: #e31837;
      margin: 0 auto 32px;
      border-radius: 2px;
    }

    .message {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f0f0f0;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .sub-message {
      font-size: 1rem;
      color: #aaaaaa;
      line-height: 1.7;
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 24px;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      font-size: 0.8rem;
      color: #555555;
      text-align: center;
      width: 100%;
    }

    @media (max-width: 480px) {
      .message {
        font-size: 1.2rem;
      }
      .logo-text {
        font-size: 1.5rem;
        padding: 12px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo-wrap">
      <!-- Replace src with the actual logo file once available -->
      <div class="logo-text">
        Jiffy Lube
        <span>Chicagoland</span>
      </div>
    </div>

    <div class="icon">&#9881;</div>

    <div class="divider"></div>

    <p class="message">We're under construction.</p>
    <p class="sub-message">Please check back for an update soon.</p>

  </div>

  <div class="footer">
    &copy; <script>document.write(new Date().getFullYear())</script> Jiffy Lube Chicagoland. All rights reserved.
  </div>

</body>
</html>
